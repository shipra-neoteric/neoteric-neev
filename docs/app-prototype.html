<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NEEV Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1EFEA; --surface:#FCFCFB; --raise:#FFFFFF; --sunk:#EDEAE4;
  --ink:#1B1E22; --ink-2:#4A5158; --ink-3:#79828B;
  --rule:#D9D5CD; --rule-2:#E8E5DE;
  --navy:#12355B; --navy-soft:#E3EAF2;
  --ochre:#A9591A; --ochre-soft:#F4E7DA;
  --bandA:#1B7F4B; --bandB:#3D6FB4; --bandC:#B8730B; --bandD:#B02D2D;
  --bandA-bg:#E4F1EA; --bandB-bg:#E4EBF6; --bandC-bg:#F7EBD9; --bandD-bg:#F7E2E2;
  --sh:0 1px 2px rgba(27,30,34,.06),0 10px 28px -18px rgba(27,30,34,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121416; --surface:#1A1D20; --raise:#22262A; --sunk:#0E1012;
  --ink:#E9E7E2; --ink-2:#B4BABF; --ink-3:#848D95;
  --rule:#343A40; --rule-2:#292E33;
  --navy:#8FB4DE; --navy-soft:#1C2A39;
  --ochre:#D9954F; --ochre-soft:#33251A;
  --bandA:#32A46A; --bandB:#5C91E3; --bandC:#C28518; --bandD:#E06060;
  --bandA-bg:#15291F; --bandB-bg:#16222F; --bandC-bg:#2B2113; --bandD-bg:#301B1B;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#121416; --surface:#1A1D20; --raise:#22262A; --sunk:#0E1012;
  --ink:#E9E7E2; --ink-2:#B4BABF; --ink-3:#848D95;
  --rule:#343A40; --rule-2:#292E33;
  --navy:#8FB4DE; --navy-soft:#1C2A39;
  --ochre:#D9954F; --ochre-soft:#33251A;
  --bandA:#32A46A; --bandB:#5C91E3; --bandC:#C28518; --bandD:#E06060;
  --bandA-bg:#15291F; --bandB-bg:#16222F; --bandC-bg:#2B2113; --bandD-bg:#301B1B;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--rule);padding:16px 0 30px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--rule-2);margin-bottom:12px}
.brand b{font-family:Archivo,sans-serif;font-size:1.12rem;font-weight:700;letter-spacing:-.01em;display:block}
.brand span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ochre)}
.navsec{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:14px 18px 5px}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 18px;color:var(--ink-2);text-decoration:none;font-size:.925rem;border-left:2px solid transparent;cursor:pointer}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--navy-soft);color:var(--navy);border-left-color:var(--ochre);font-weight:600}
.rail a .ic{width:15px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.85}
.main{min-width:0;padding:0 0 70px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 26px;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:20}
.topbar h1{font-family:Archivo,sans-serif;font-size:1.16rem;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.pad{padding:22px 26px}
.demo{background:var(--ochre-soft);border-bottom:1px solid var(--rule);padding:7px 26px;font-size:.83rem;color:var(--ink-2)}
.demo b{color:var(--ochre)}

/* ---- controls ---- */
.sel{background:var(--raise);border:1px solid var(--rule);border-radius:4px;padding:5px 9px;font-size:.86rem;cursor:pointer}
.btn{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:7px 15px;font-size:.87rem;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0E1012}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chipbar{display:flex;gap:3px}
.chip{border:1px solid var(--rule);background:var(--raise);border-radius:3px;width:27px;height:27px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--ink-3);padding:0}
.chip:hover{border-color:var(--ochre)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--surface);}
.chip.on.a{background:var(--bandD);border-color:var(--bandD)}
.chip.on.l{background:var(--bandC);border-color:var(--bandC)}

/* ---- cards / grid ---- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:16px 18px}
.card h3{font-family:Archivo,sans-serif;font-size:.98rem;font-weight:600;margin:0 0 10px}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.big{font-family:Archivo,sans-serif;font-size:2.05rem;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{font-size:.82rem;color:var(--ink-3);margin-top:5px}

/* ---- alerts ---- */
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:4px;border-left:3px solid;font-size:.89rem;margin-bottom:9px;background:var(--surface)}
.alert.warn{border-color:var(--bandC);background:var(--bandC-bg)}
.alert.crit{border-color:var(--bandD);background:var(--bandD-bg)}
.alert.info{border-color:var(--navy);background:var(--navy-soft)}
.alert .ai{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.8rem;flex-shrink:0;padding-top:1px}

/* ---- band chips ---- */
.band{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:.76rem;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap}
.band .dot{width:7px;height:7px;border-radius:50%}
.bA{background:var(--bandA-bg);color:var(--bandA)} .bA .dot{background:var(--bandA)}
.bB{background:var(--bandB-bg);color:var(--bandB)} .bB .dot{background:var(--bandB)}
.bC{background:var(--bandC-bg);color:var(--bandC)} .bC .dot{background:var(--bandC)}
.bD{background:var(--bandD-bg);color:var(--bandD)} .bD .dot{background:var(--bandD)}

/* ---- tables ---- */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:5px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
   color:var(--ink-3);padding:9px 13px;border-bottom:1px solid var(--rule);background:var(--raise);white-space:nowrap;position:sticky;top:0}
td{padding:9px 13px;border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
td.name{color:var(--ink);font-weight:600}
.pod{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink-3)}

/* ---- dept tags ---- */
.dt{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.73rem;font-weight:600;padding:2px 7px;border-radius:3px}
.dSUP{background:var(--navy-soft);color:var(--navy)}
.dQC{background:var(--ochre-soft);color:var(--ochre)}
.dMEA{background:var(--bandB-bg);color:var(--bandB)}
.dSTR{background:var(--sunk);color:var(--ink-2)}

/* ---- charts ---- */
.chart{width:100%;overflow:visible}
.chart .gridline{stroke:var(--rule-2);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:9.5px}
.chart .barlbl{fill:var(--ink-2);font-family:"Source Sans 3",sans-serif;font-size:11px}
.chart .val{fill:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600}
.bar{rx:2}
.bar:not([style]){fill:var(--navy)}
.bar:hover{fill:var(--ochre)}
.tip{position:fixed;pointer-events:none;background:var(--raise);border:1px solid var(--rule);border-radius:4px;
  padding:7px 10px;font-size:.82rem;box-shadow:var(--sh);z-index:99;opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:.88rem;color:var(--ink)}
.tip span{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:.78rem}

/* ---- video ---- */
.vids{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.vid{background:var(--surface);border:1px solid var(--rule);border-radius:5px;overflow:hidden;cursor:pointer}
.vid:hover{border-color:var(--ochre)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--sunk),var(--rule-2));display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--rule-2)}
.play{width:38px;height:38px;border-radius:50%;background:var(--bandD);display:flex;align-items:center;justify-content:center}
.play::after{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.78);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 5px;border-radius:2px}
.vmeta{padding:9px 11px 11px}
.vmeta b{display:block;font-size:.87rem;font-weight:600;color:var(--ink);line-height:1.32;margin-bottom:3px}
.vmeta small{font-size:.77rem;color:var(--ink-3)}
.vst{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;padding:1px 6px;border-radius:2px;margin-top:6px}
.vst.linked{background:var(--bandA-bg);color:var(--bandA)}
.vst.sugg{background:var(--sunk);color:var(--ink-3)}

/* ---- module accordion ---- */
.mod{border:1px solid var(--rule);border-radius:5px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.modh{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.modh:hover{background:var(--sunk)}
.modh .mid{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;color:var(--ochre)}
.modh .mt{flex:1;font-weight:600;color:var(--ink);font-size:.93rem}
.modh .cnt{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-3)}
.modb{padding:0 15px 16px;border-top:1px solid var(--rule-2)}

/* ---- drawer / modal ---- */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:50;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--ground);border-left:1px solid var(--rule);
  z-index:51;overflow-y:auto;transform:translateX(100%);transition:transform .18s ease;box-shadow:var(--sh)}
.drawer.on{transform:none}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:15px 20px;display:flex;align-items:flex-start;gap:12px;z-index:2}
.dhead h2{font-family:Archivo,sans-serif;font-size:1.12rem;margin:0;flex:1;font-weight:600}
.x{background:none;border:1px solid var(--rule);border-radius:4px;width:28px;height:28px;cursor:pointer;color:var(--ink-2);line-height:1}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:51;width:min(620px,92vw);
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--sh);display:none}
.modal.on{display:block}

/* ---- phone ---- */
.phone{width:330px;border:9px solid #23262A;border-radius:32px;background:var(--surface);overflow:hidden;box-shadow:var(--sh);flex-shrink:0}
.pscreen{height:600px;overflow-y:auto;background:var(--ground)}
.ptop{background:var(--navy);color:#fff;padding:13px 15px 11px;position:sticky;top:0;z-index:3}
:root[data-theme="dark"] .ptop,:root:not([data-theme="light"]) .ptop{color:#0E1012}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .ptop{color:#fff}}
.ptop b{font-family:Archivo,sans-serif;font-size:1rem;display:block}
.ptop small{opacity:.8;font-size:.76rem}
.ptabs{display:flex;background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:2}
.ptabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 3px;font-size:.76rem;color:var(--ink-3);cursor:pointer}
.ptabs button.on{color:var(--navy);border-bottom-color:var(--ochre);font-weight:600}
.pbody{padding:13px}
.pcard{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 13px;margin-bottom:10px}

/* ---- spec ---- */
.spec h2{font-family:Archivo,sans-serif;font-size:1.24rem;margin:30px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.spec h3{font-family:Archivo,sans-serif;font-size:1rem;margin:20px 0 6px}
.spec p,.spec li{max-width:76ch;color:var(--ink-2)}
.spec code,.mono{font-family:"IBM Plex Mono",monospace;font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:3px;color:var(--ink)}
pre{background:var(--sunk);border:1px solid var(--rule-2);border-radius:5px;padding:13px 15px;overflow-x:auto;
  font-family:"IBM Plex Mono",monospace;font-size:.8rem;line-height:1.6;color:var(--ink)}
pre .k{color:var(--ochre)} pre .c{color:var(--ink-3)}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.72rem;padding:2px 7px;border-radius:3px;background:var(--navy-soft);color:var(--navy);margin-right:5px}
.pill.v2{background:var(--sunk);color:var(--ink-3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:var(--surface);
  padding:10px 20px;border-radius:5px;font-size:.88rem;font-weight:600;z-index:80;transition:transform .2s;box-shadow:var(--sh)}
.toast.on{transform:translateX(-50%)}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--navy);border-radius:2px}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;display:flex;overflow-x:auto;gap:0;padding:0;border-right:0;border-bottom:1px solid var(--rule)}
  .brand,.navsec{display:none}
  .rail a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:11px 13px}
  .rail a.on{border-left:0;border-bottom-color:var(--ochre)}
  .pad,.topbar,.demo{padding-left:15px;padding-right:15px}
}
</style>

</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="brand"><b>NEEV Tracker</b><span>Batch 2026-01</span></div>
  </nav>
  <div class="main">
    <div class="demo">
      <b>Clickable prototype.</b> Sample data, 12 fictional trainees. Attendance, log scores, assessment marks and the video library are all editable — changes recompute live but are not saved anywhere.
    </div>
    <div class="topbar">
      <h1 id="ttl">Dashboard</h1>
      <label style="font-size:.8rem;color:var(--ink-3)">Signed in as</label>
      <select class="sel" id="role"></select>
    </div>
    <div class="pad" id="view"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Detail"></aside>
<div class="modal" id="modal" role="dialog" aria-label="Video"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================== DATA ============================== */
const DEPTS={SUP:{n:"Supervision",c:"dSUP"},QC:{n:"Quality",c:"dQC"},MEA:{n:"Measurement",c:"dMEA"},STR:{n:"Store",c:"dSTR"}};

const DAYS=[["D01","1 Sep","Tue"],["D02","2 Sep","Wed"],["D03","3 Sep","Thu"],["D04","4 Sep","Fri"],["D05","5 Sep","Sat"],
["D06","7 Sep","Mon"],["D07","8 Sep","Tue"],["D08","9 Sep","Wed"],["D09","10 Sep","Thu"],["D10","11 Sep","Fri"],["D11","12 Sep","Sat"],
["D12","14 Sep","Mon"],["D13","15 Sep","Tue"],["D14","16 Sep","Wed"],["D15","17 Sep","Thu"],["D16","18 Sep","Fri"],["D17","19 Sep","Sat"],
["D18","21 Sep","Mon"],["D19","22 Sep","Tue"],["D20","23 Sep","Wed"],["D21","24 Sep","Thu"],["D22","25 Sep","Fri"],["D23","26 Sep","Sat"],
["D24","28 Sep","Mon"],["D25","29 Sep","Tue"],["D26","30 Sep","Wed"]];
const TODAY=13; // index into DAYS — prototype "today" is D14, 16 Sep

const NAMES=["Aditya Sharma","Rohit Yadav","Priyanshu Jain","Deepak Rathore","Sandeep Kushwaha","Nikhil Tomar",
"Ankit Gupta","Shivam Dubey","Ravi Parihar","Vishal Bhadauria","Manish Sen","Arjun Singh"];
const BRANCH=["Civil — Govt Polytechnic Gwalior","Civil — MITS Polytechnic","Civil — Govt Polytechnic Morena",
"Mechanical — Govt Polytechnic Gwalior","Civil — Govt Polytechnic Bhind","Civil — MITS Polytechnic",
"Civil — Govt Polytechnic Gwalior","Electrical — Govt Polytechnic Gwalior","Civil — Govt Polytechnic Datia",
"Civil — Govt Polytechnic Gwalior","Civil — Govt Polytechnic Shivpuri","Civil — MITS Polytechnic"];
const BUDDIES=["S. Chauhan (Sr. Engr)","M. Ahirwar (Sr. Engr)","P. Dixit (QC Engr)","K. Raghuvanshi (Sr. Engr)"];

// deterministic pseudo-random so the prototype is stable
let _s=7;const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff};

const BASE=[34,52,61,28,45,58,39,66,31,48,55,42];
const WR=[28,31,36,22,30,34,26,35,14,29,33,27];
const PR=[24,22,27,15,23,26,19,26,9,22,25,20];
const BH=[26,24,28,17,25,27,22,27,10,24,26,23];

const T=NAMES.map((n,i)=>{
  const att=[],logs=[];
  for(let d=0;d<DAYS.length;d++){
    if(d>TODAY){att.push(null);logs.push(null);continue}
    const r=rnd();
    att.push(r>0.965?(r>0.985?"L":"A"):"P");
    const drift=(i%4===3||i===8?0.4:1.0);
    let v=Math.round(2.1+drift*(d*0.085)+ (BASE[i]-45)/38 + (rnd()-0.5)*0.9);
    logs.push(Math.max(1,Math.min(5,v)));
  }
  return{id:"T"+String(i+1).padStart(2,"0"),name:n,branch:BRANCH[i],pod:(i%4)+1,buddy:BUDDIES[i%4],
    base:BASE[i],w:WR[i],p:PR[i],b:BH[i],att,logs,
    drills:{SUP:null,QC:null,MEA:null,STR:null},capstone:null,
    docs:{aadhaar:true,pan:i!==3&&i!==8,diploma:true,bank:i!==6,medical:i%5!==2,coi:i<9},
    watched:[]};
});
// T09 is the deliberate band-D case in the sample: absent days, weak logs, no measurable improvement
[2,6,9,11].forEach(d=>{if(T[8].att[d]!=null)T[8].att[d]="A"});
T[8].logs=T[8].logs.map(v=>v==null?null:Math.max(1,v-1));
T.forEach((t,i)=>{if(i%4===0)t.drills.SUP=62+Math.round(rnd()*22);});

const chk=t=>t.w+t.p+t.b;
const vel=t=>t.base>=100?0:Math.round(((chk(t)-t.base)/(100-t.base))*1000)/10;
const logAvg=t=>{const v=t.logs.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
const attPct=t=>{const v=t.att.filter(x=>x!=null);if(!v.length)return 0;
  return (v.filter(x=>x==="P").length+0.5*v.filter(x=>x==="H").length)/v.length};
const drillAvg=t=>{const v=Object.values(t.drills).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const W={log:.15,buddy:.15,test:.15,chk:.25,drill:.15,cap:.15};
const buddyR=t=>Math.min(5,Math.max(1,Math.round((logAvg(t)*0.7+attPct(t)*2.4)*10)/10));
const testAvg=t=>Math.min(20,Math.round((chk(t)/100*17+2)*10)/10);
function finalScore(t){
  const parts=[[logAvg(t)/5*100,W.log],[buddyR(t)/5*100,W.buddy],[testAvg(t)/20*100,W.test],[chk(t),W.chk]];
  const d=drillAvg(t); if(d!=null)parts.push([d,W.drill]);
  if(t.capstone!=null)parts.push([t.capstone,W.cap]);
  const wsum=parts.reduce((a,x)=>a+x[1],0);
  return Math.round(parts.reduce((a,x)=>a+x[0]*x[1],0)/wsum*10)/10;
}
function band(t){const f=finalScore(t),v=vel(t);
  if(f>=75&&v>=55)return"A"; if(f>=60)return"B"; if(f>=45)return"C"; return"D"}

/* ============================== CHARTS ============================== */
function hBar(rows,opts={}){
  const bh=20,gap=8,padL=130,padR=54,padT=8,padB=24,w=opts.w||580;
  const h=padT+padB+rows.length*(bh+gap);
  const mx=opts.max||Math.max(...rows.map(r=>r.v),1);
  const iw=w-padL-padR;
  let ticks="";
  for(let i=0;i<=4;i++){const x=padL+iw*i/4;
    ticks+=`<line class="gridline" x1="${x}" y1="${padT}" x2="${x}" y2="${h-padB+2}"/>`+
    `<text class="axis" x="${x}" y="${h-padB+15}" text-anchor="middle">${Math.round(mx*i/4)}</text>`}
  const bars=rows.map((r,i)=>{
    const y=padT+i*(bh+gap),bw=Math.max(2,iw*r.v/mx);
    return `<text class="barlbl" x="${padL-9}" y="${y+bh/2+4}" text-anchor="end">${esc(r.k)}</text>`+
      `<rect class="bar" x="${padL}" y="${y}" width="${bw}" height="${bh}" rx="2" style="fill:${r.c||'var(--navy)'}"`+
      ` data-tip="${esc(r.k)}|${esc(r.t||r.v+(opts.unit||''))}" tabindex="0"/>`+
      `<text class="val" x="${padL+bw+7}" y="${y+bh/2+4}">${esc(r.lab!=null?r.lab:r.v)}</text>`}).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.aria||'Bar chart')}">${ticks}${bars}</svg>`;
}
function spark(vals,{w=250,h=44}={}){
  const v=vals.filter(x=>x!=null);if(v.length<2)return `<div class="sub">Not enough data yet</div>`;
  const mx=5,mn=0,pad=4,iw=w-pad*2,ih=h-pad*2;
  const pts=v.map((y,i)=>[pad+iw*i/(v.length-1),pad+ih-(y-mn)/(mx-mn)*ih]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=d+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pad} ${h-pad} Z`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily log score trend">
    <path d="${area}" fill="var(--navy)" opacity=".1"/>
    <path d="${d}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--ochre)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

  <p>Twelve trainees, five staff roles, one batch at a time, growing to three or four concurrent batches within two years. This is a small-data application — the hard parts are offline mobile capture and role permissions, not scale.</p>

    <li><b>Web</b> — React or Vue SPA for the staff screens. Desktop-first; staff work from an office laptop.</li>
    <li><b>Mobile</b> — a PWA, not a native app. It must install to the home screen and work offline. React Native only if push notifications become essential later.</li>
    <li><b>Auth</b> — phone number + OTP for trainees (they will forget passwords and they all have phones); email + password for staff.</li>
    <li><b>Files</b> — S3-compatible object storage for joining documents and any photo evidence.</li>
  </ul>

  <h2>2. Data model</h2>
  <p>Fourteen tables. Everything else is a computed view.</p>
  <pre><span class="k">batch</span>          id, name, start_date, phase1_end, gateway_date, status
<span class="k">person</span>         id, name, phone, email, role, active
               <span class="c">role: trainee | coordinator | supervisor | office | buddy | dept_head | exec</span>
<span class="k">trainee</span>        id, person_id, batch_id, pod_id, buddy_id, branch, base_location,
               joining_date, baseline_score, status
               <span class="c">status: active | exited | gateway_passed | confirmed</span>
<span class="k">pod</span>            id, batch_id, name, buddy_id
<span class="k">day</span>            id, batch_id, date, day_code, phase, module_id, is_muster_day, is_off
<span class="k">attendance</span>     id, trainee_id, day_id, status, marked_by, marked_at
               <span class="c">status: P | A | L | H</span>
<span class="k">daily_log</span>      id, trainee_id, day_id, body_json, submitted_at,
               score, reviewed_by, reviewed_at, review_note
               <span class="c">body_json holds the six prompts; score 1-5 set by the reviewer</span>
<span class="k">module</span>         id, code, title, department, handbook_section, sequence
<span class="k">video</span>          id, module_id, youtube_id, title, channel, duration_s,
               status, added_by, approved_by
               <span class="c">status: suggested | linked | retired</span>
<span class="k">video_progress</span> id, trainee_id, video_id, seconds_watched, completed_at
<span class="k">assessment</span>     id, trainee_id, kind, written, practical, behavioural,
               total, assessed_by, assessed_at
               <span class="c">kind: baseline | checkpoint | drill | capstone | gateway</span>
<span class="k">rotation</span>       id, pod_id, block_code, department, starts_on, ends_on
<span class="k">checklist_item</span> id, trainee_id, item_index, done, signed_by, signed_at, evidence_url
<span class="k">document</span>       id, trainee_id, kind, file_url, verified_by, verified_at</pre>

  <h3>Computed, never stored</h3>
  <p>These are derived on read. Storing them creates two sources of truth and they will drift.</p>
  <pre><span class="k">checkpoint</span> = written + practical + behavioural
<span class="k">velocity</span>   = (checkpoint − baseline) ÷ (100 − baseline) × 100
<span class="k">log_avg</span>    = mean(daily_log.score) over submitted logs
<span class="k">att_pct</span>    = (count(P) + 0.5 × count(H)) ÷ count(marked)
<span class="k">final</span>      = weighted mean of available components, re-weighted
             over the components that actually have marks
<span class="k">band</span>       = A if final ≥ 75 and velocity ≥ 55
             B if final ≥ 60
             C if final ≥ 45
             D otherwise</pre>
  <p><b>Re-weighting matters.</b> In week two there are no drill or capstone marks. If you divide by the full weight set, every trainee looks like a failure. Divide by the sum of the weights that have data.</p>

  <h2>3. API</h2>
  <pre><span class="k">GET</span>  /api/batches/:id/dashboard        <span class="c">tiles, alerts, band counts</span>
<span class="k">GET</span>  /api/batches/:id/days/:date       <span class="c">daily entry grid, 12 rows</span>
<span class="k">PUT</span>  /api/attendance/bulk              <span class="c">[{trainee_id, day_id, status}] — one call for the grid</span>
<span class="k">PUT</span>  /api/logs/:id/review              <span class="c">{score, note} — coordinator only</span>
<span class="k">POST</span> /api/logs                         <span class="c">trainee submits; idempotent on (trainee, day)</span>
<span class="k">GET</span>  /api/trainees?batch=&pod=         <span class="c">list with computed band and velocity</span>
<span class="k">GET</span>  /api/trainees/:id                 <span class="c">full profile for the drawer</span>
<span class="k">PUT</span>  /api/assessments/:id              <span class="c">marks; recomputes band on read</span>
<span class="k">GET</span>  /api/modules?with=videos
<span class="k">POST</span> /api/videos                       <span class="c">{module_id, url} — server resolves via oEmbed</span>
<span class="k">POST</span> /api/videos/:id/progress          <span class="c">{seconds, completed}</span>
<span class="k">PUT</span>  /api/checklist/:id/sign           <span class="c">buddy or dept head only</span>
<span class="k">GET</span>  /api/batches/:id/report?month=    <span class="c">the monthly pack</span></pre>
  <p><b>Bulk attendance is the one to get right.</b> Rajat marks twelve people in about forty seconds. Twelve separate requests over site 4G will fail halfway and leave the grid inconsistent. One call, one transaction.</p>

  <h2>4. Roles and permissions</h2>
  <div class="tw"><table><thead><tr><th>Capability</th><th>Trainee</th><th>Buddy</th><th>Rajat</th><th>Deepti</th><th>Bharti</th></tr></thead><tbody>
    ${[["Submit own daily log","✓","","","",""],
       ["View own band and scores","✓","","","",""],
       ["Watch module videos","✓","✓","✓","✓",""],
       ["Mark attendance","","","✓","✓",""],
       ["Score and sign a daily log","","","✓","✓",""],
       ["Weekly buddy rating","","own pod","","✓",""],
       ["Sign a checklist item","","own pod","✓","✓",""],
       ["Enter assessment marks","","","","✓",""],
       ["Set or override a band","","","","✓",""],
       ["Allot department / rotation","","","draft","approve",""],
       ["Add a video to the library","","","✓","✓",""],
       ["Approve a video for release","","","","✓",""],
       ["Upload and verify documents","","","","","✓"],
       ["Export the monthly pack","","","✓","✓","✓"]
      ].map(r=>`<tr><td class="name" style="font-weight:500">${r[0]}</td>${r.slice(1).map(c=>
        `<td style="text-align:center;color:${c?"var(--bandA)":"var(--rule)"};font-weight:600">${c||"·"}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>
  <p style="margin-top:12px">The distinction that matters: <b>Rajat records, Deepti decides.</b> Rajat cannot set a band and cannot approve an allotment. If the app lets him, the ownership split you designed on paper stops existing within a fortnight.</p>

  <h2>5. YouTube integration</h2>
  <ul>
    <li>Admin pastes a full YouTube URL. Server extracts the ID and calls the <span class="mono">oEmbed</span> endpoint for title, channel and thumbnail; the Data API v3 gives duration if you want it. Store the ID, never the full URL.</li>
    <li>Player is the <b>YouTube IFrame Player API</b>. Bind <span class="mono">onStateChange</span> and post progress every 15 seconds and on pause.</li>
    <li>Mark <b>completed at 90%</b> of duration, not 100% — nobody watches the end card.</li>
    <li>A video goes <span class="mono">suggested → linked</span> only when Deepti approves it. A video that contradicts your specification is worse than no video, and the person curating is not always the person who knows the specification.</li>
    <li>Videos are pre-reading, not a substitute for the module. Do not build anything that lets a trainer skip a session because a video exists.</li>
    <li>Handle the dead-link case: check linked videos weekly and flag any that 404. Public videos get taken down.</li>
  </ul>

  <h2>6. Offline behaviour — the part that decides adoption</h2>
  <p>The trainee writes their log standing on a slab with one bar of signal. Get this wrong and they stop using the app in week two, permanently.</p>
  <ul>
    <li>Service worker caches the shell, today's module, and the log form.</li>
    <li>Log submissions write to IndexedDB first, then sync. Show a clear queued state — never a spinner that fails silently.</li>
    <li>Idempotency key on <span class="mono">(trainee_id, day_id)</span> so a retry does not create a duplicate log.</li>
    <li>Videos are the one thing that needs connectivity. Say so, and default the player to 480p — twelve trainees on ₹20,000 CTC are paying for that data themselves.</li>
  </ul>

  <h2>7. What to build first</h2>
  <p>Batch 2026-01 starts on 1 September. A tool that arrives in December is a tool for Batch 02. Ship in this order.</p>
  <h3><span class="pill">v1</span>Before 30 September — replaces the spreadsheet</h3>
  <ul>
    <li>Staff login, trainee master, the day calendar</li>
    <li>Bulk attendance and log scoring — the daily entry grid</li>
    <li>Trainee list with computed band and velocity, and the detail drawer</li>
    <li>Assessment entry for the checkpoint</li>
    <li>The monthly pack as a generated PDF</li>
  </ul>
  <h3><span class="pill">v2</span>October — the trainee PWA</h3>
  <ul>
    <li>OTP login, offline log submission, own band and checklist</li>
    <li>Module library with video playback and progress</li>
    <li>Buddy weekly rating on mobile</li>
  </ul>
  <h3><span class="pill v2">v3</span>Before the Gateway, December</h3>
  <ul>
    <li>Checklist sign-off with photo evidence</li>
    <li>Department immersion reviews and the Gateway assessment screen</li>
    <li>Multi-batch support, so Batch 02 does not need a second deployment</li>
  </ul>

  <h2>8. Things that look like details and are not</h2>
  <ul>
    <li><b>Never delete a log or a mark.</b> Soft-delete and keep an audit trail with who changed what and when. This programme decides whether someone keeps their job in January; the record has to survive being questioned.</li>
    <li><b>Timestamp the log review separately from the submission.</b> A log reviewed at 09:00 the next morning is not the same as one reviewed at 17:30 in front of the trainee, and you want to be able to see the difference.</li>
    <li><b>The baseline is write-once.</b> Lock it after D01. If it can be edited later, velocity can be gamed and it stops meaning anything.</li>
    <li><b>Store the weights per batch, not in code.</b> They will change for Batch 02, and Batch 01's history must keep computing with Batch 01's weights.</li>
    <li><b>Every trainee-visible number needs a plain-language sentence beside it.</b> A 21-year-old seeing "velocity 29" with no explanation will read it as a failing grade.</li>
  </ul>
</div>`}

/* ============================== RENDER ============================== */
const VIEWS={dash:vDash,daily:vDaily,trainees:vTrainees,modules:vModules,rotation:vRotation,
  assess:vAssess,reports:vReports,mobile:vMobile,spec:vSpec};
const TITLES={dash:"Dashboard",daily:"Daily entry",trainees:"Trainees",modules:"Modules & videos",
  rotation:"Rotation",assess:"Assessment",reports:"Monthly pack",mobile:"Trainee app",spec:"Build spec"};

function renderRail(){
  const allowed=ROLES[ROLE].nav;
  let h=`<div class="brand"><b>NEEV Tracker</b><span>Batch 2026-01</span></div>`;
  let sec=null;
  NAV.forEach(([k,ic,label,section])=>{
    if(!allowed.includes(k))return;
    if(section&&section!==sec){h+=`<div class="navsec">${section}</div>`;sec=section}
    h+=`<a class="${VIEW===k?"on":""}" onclick="go('${k}')" tabindex="0" onkeydown="if(event.key==='Enter')go('${k}')"><span class="ic">${ic}</span>${label}</a>`;
  });
  $("#rail").innerHTML=h;
}
window.go=v=>{VIEW=v;closeD();closeV();render()};
function render(){
  const allowed=ROLES[ROLE].nav;
  if(!allowed.includes(VIEW))VIEW=allowed[0];
  renderRail();
  $("#ttl").textContent=TITLES[VIEW];
  $(".demo").innerHTML=`<b>Clickable prototype · sample data.</b> ${ROLES[ROLE].note}`;
  $("#view").innerHTML=VIEWS[VIEW]();
  const ds=$("#dsel");if(ds)ds.onchange=e=>{toast("Prototype shows one day; the built app loads any date");e.target.value=TODAY};
  bindTips();
}
function bindTips(){
  const tip=$("#tip");
  document.querySelectorAll("[data-tip]").forEach(el=>{
    const show=e=>{const[a,b]=el.dataset.tip.split("|");
      tip.innerHTML=`<b>${a}</b><span>${b}</span>`;tip.style.opacity="1";
      const r=el.getBoundingClientRect();tip.style.left=Math.min(window.innerWidth-190,r.right+10)+"px";
      tip.style.top=Math.max(8,r.top-6)+"px"};
    el.addEventListener("mouseenter",show);el.addEventListener("focus",show);
    el.addEventListener("mouseleave",()=>tip.style.opacity="0");
    el.addEventListener("blur",()=>tip.style.opacity="0");
  });
}
$("#role").innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("");
$("#role").onchange=e=>{ROLE=e.target.value;render()};
$("#scrim").onclick=()=>{closeD();closeV()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeD();closeV()}});
render();
</script>
